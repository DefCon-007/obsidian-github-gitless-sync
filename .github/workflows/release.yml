name: Release Obsidian plugin

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump minor release version
        id: release-version
        run: |
          pnpm run bump:minor
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate and package plugin
        run: |
          pnpm lint
          pnpm test
          pnpm release

      - name: Ensure version has not been released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/defcon-github-gitless-sync/main.js
            dist/defcon-github-gitless-sync/manifest.json
            dist/defcon-github-gitless-sync/styles.css

      - name: Commit release version
        id: release-commit
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json manifest-beta.json versions.json
          git commit -m "Bump plugin version to $VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "${{ steps.release-commit.outputs.sha }}" \
            --title "$VERSION" \
            --generate-notes \
            --fail-on-no-commits \
            dist/defcon-github-gitless-sync/main.js \
            dist/defcon-github-gitless-sync/manifest.json \
            dist/defcon-github-gitless-sync/styles.css
